name: Release

# Publishes the platform packages and then the main package when a version tag
# is pushed. The tag must match the version in package.json (v0.1.0 for 0.1.0).
#
# Publishing uses npm trusted publishing, so no token is stored. On npmjs.com,
# each of the five packages must list this repository and this workflow file
# (release.yml) as a trusted publisher. That can only be set up once a package
# exists, so the very first version is published by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: npm ci
      - run: npm run build
      - run: npm run build:helper
      - run: npm test
      # --stamp adds the platform packages to package.json as optionalDependencies.
      - run: npm run build:packages -- --stamp
      # Platform packages first, so the main package's dependencies exist when it
      # lands. Anything already on npm at this version is skipped, so a run that
      # failed partway can simply be re-run.
      - name: Publish
        run: |
          for dir in npm/*/ ./; do
            name="$(node -p "require('./${dir}package.json').name")"
            version="$(node -p "require('./${dir}package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
            else
              npm publish "./$dir" --access public
            fi
          done
