name: Release

# Publishes the platform packages and then the main package when a version tag
# is pushed. The tag must match the version in package.json (v0.1.0 for 0.1.0).
#
# Publishing uses npm trusted publishing: configure this repository and workflow
# as a trusted publisher for each package on npmjs.com, and no token is stored.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y lsof
      - run: npm ci
      - run: npm run build
      - run: npm run build:helper
      - run: npm test
      - run: npm run build:packages
      # Platform packages first, so the main package's dependencies exist when it lands.
      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done
      - name: Publish main package
        run: npm publish --access public --provenance
